services:
  campkit:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
      - livekit
    command: ./bin/start-app
    ports:
      - "${CAMPKIT_PUBLISHED_PORT:-3000}:3000"
    volumes:
      - campkit-storage:/rails/storage
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-dev-secret-key-base-change-me}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      DISABLE_SSL: ${DISABLE_SSL:-true}
      SKIP_TELEMETRY: ${SKIP_TELEMETRY:-true}
      RAILS_ENV: ${RAILS_ENV:-production}
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret_devsecret_devsecret_1234}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/up" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "no", "--save", "" ]
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.9.3
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_devsecret_devsecret_1234}"
    command: [ "--config", "/etc/livekit/livekit.yaml" ]
    volumes:
      - ./ops/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "3479:3479/udp"
      - "50000-50100:50000-50100/udp"

volumes:
  campkit-storage:
