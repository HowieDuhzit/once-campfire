version: '3.9'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - campfire

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    depends_on:
      - redis
    command:
      - "--config"
      - "/config/livekit.yaml"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}
      - LIVEKIT_REDIS_ADDRESS=redis:6379
    volumes:
      - ./docker/livekit/livekit.yaml:/config/livekit.yaml:ro
      - ./certs:/certs:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "50000-60000:50000-60000/udp"
    networks:
      - campfire

  campfire:
    image: 'howieduhzit/campfire:meet-latest'
    restart: unless-stopped
    depends_on:
      - livekit
    volumes:
      - 'campfire-storage:/rails/storage'
    environment:
      - SERVICE_URL_CAMPFIRE_80
      - 'SECRET_KEY_BASE=${SERVICE_BASE64_64_CAMPFIRE}'
      - 'VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}'
      - 'VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}'
      - 'DISABLE_SSL=${DISABLE_SSL:-true}'
      - 'SSL_DOMAIN=${SSL_DOMAIN:-false}'
      - 'SKIP_TELEMETRY=${SKIP_TELEMETRY:-true}'
      - 'SENTRY_DSN=${SENTRY_DSN}'
      - 'LIVEKIT_URL=${LIVEKIT_URL:-http://livekit:7880}'
      - 'LIVEKIT_API_KEY=${LIVEKIT_API_KEY}'
      - 'LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost/up'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campfire

volumes:
  campfire-storage:
  redis-data:

networks:
  campfire:
    driver: bridge
