services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - campfire

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    depends_on:
      - redis
    command:
      - "--config"
      - "/config/livekit.yaml"
    environment:
      - 'LIVEKIT_KEYS=${LIVEKIT_API_KEY:-livekit_dev_api_key_1234567890abcdefABCDEF}: ${LIVEKIT_API_SECRET:-livekit_dev_secret_1234567890abcdefABCDEF}'
      - LIVEKIT_REDIS_ADDRESS=redis:6379
    volumes:
      - ./docker/livekit:/config:ro
      - ./certs:/certs:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "59000-59010:59000-59010/udp"
    networks:
      - campfire

  campfire:
    image: 'howieduhzit/campfire:meet-latest'
    restart: unless-stopped
    depends_on:
      - livekit
    volumes:
      - 'campfire-storage:/rails/storage'
    environment:
      - SERVICE_URL_CAMPFIRE_80=https://${CAMPFIRE_HOST:-campfire.localhost}
      - 'SERVICE_BASE64_64_CAMPFIRE=${SERVICE_BASE64_64_CAMPFIRE:-devcampfire}'
      - 'SECRET_KEY_BASE=${SECRET_KEY_BASE:-dev_secret_key_base}'
      - 'VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}'
      - 'VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}'
      - 'DISABLE_SSL=${DISABLE_SSL:-true}'
      - 'SSL_DOMAIN=${SSL_DOMAIN:-false}'
      - 'SKIP_TELEMETRY=${SKIP_TELEMETRY:-true}'
      - 'SENTRY_DSN=${SENTRY_DSN}'
      - 'LIVEKIT_URL=https://${LIVEKIT_HOST:-livekit.localhost}'
      - 'LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-livekit_dev_api_key_1234567890abcdefABCDEF}'
      - 'LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-livekit_dev_secret_1234567890abcdefABCDEF}'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost/up'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campfire

  proxy:
    image: caddy:2.8.5
    restart: unless-stopped
    depends_on:
      - campfire
      - livekit
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CAMPFIRE_HOST=${CAMPFIRE_HOST:-campfire.localhost}
      - LIVEKIT_HOST=${LIVEKIT_HOST:-livekit.localhost}
      - TLS_DIRECTIVE=${TLS_DIRECTIVE:-tls internal}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - campfire

volumes:
  campfire-storage:
  redis-data:

networks:
  campfire:
    driver: bridge
