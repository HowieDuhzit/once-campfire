# Minimal LiveKit configuration used by the AllInOne stack.
# Use LIVEKIT_KEYS (key:secret) and LIVEKIT_REDIS_ADDRESS via Docker Compose to keep secrets outside the config file.

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 59000
  port_range_end: 59010
  use_external_ip: false

room:
  auto_create: true
  max_participants: 150

logging:
  level: info

redis:
  address: redis:6379

turn:
  enabled: false  # enable TLS/UDP TURN by setting this to true and mounting certificates at /certs
